<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/my-portfolio/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Портфолио Fullstack-разработчика - Вёрстка | JavaScript | VueJS | PHP | Laravel"
    />
    <title>Портфолио | Fullstack-developer</title>

    <!-- Предзагрузка локальных woff2-шрифтов (ускоряет FCP, избегает FOUT) -->
    <link rel="preload" href="/src/assets/fonts/latolight.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/latoregular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/latobold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- preconnect/dns-prefetch для внешних ресурсов (GitHub, Telegram) -->
    <link rel="preconnect" href="https://github.com" crossorigin />
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="preconnect" href="https://t.me" crossorigin />
    <link rel="dns-prefetch" href="https://t.me" />

    <!-- Open Graph (соцсети) -->
    <meta property="og:title" content="Портфолио | Fullstack-developer" />
    <meta
      property="og:description"
      content="Портфолио Fullstack-разработчика - Вёрстка | JavaScript | VueJS | PHP | Laravel"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexchasx.github.io/my-portfolio/" />
    <meta property="og:image" content="/my-portfolio/og-preview.webp" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Портфолио | Fullstack-developer" />
    <meta
      name="twitter:description"
      content="Портфолио Fullstack-разработчика - Вёрстка | JavaScript | VueJS | PHP | Laravel"
    />
    <meta name="twitter:image" content="/my-portfolio/og-preview.webp" />

    <!-- Structured data (JSON-LD) для rich-результатов -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://alexchasx.github.io/my-portfolio/#person",
        "name": "Александр Часовников",
        "jobTitle": "Fullstack Developer",
        "url": "https://alexchasx.github.io/my-portfolio/",
        "image": "https://alexchasx.github.io/my-portfolio/og-preview.webp",
        "description": "Портфолио Fullstack-разработчика. Вёрстка, JavaScript, VueJS, Laravel, PHP. Примеры проектов, опыт и контакты.",
        "email": "a.s.chasovnikov@yandex.ru",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Белгородская область",
          "addressCountry": "RU"
        },
        "sameAs": ["https://github.com/alexchasx", "https://t.me/a_chasovnikov"]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Портфолио | Fullstack-developer",
        "url": "https://alexchasx.github.io/my-portfolio/",
        "inLanguage": "ru",
        "publisher": {
          "@id": "https://alexchasx.github.io/my-portfolio/#person"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
